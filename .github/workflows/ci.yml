name: CI

on:
  push:
    branches: ["main", "fix/*"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Clone Backend Core
        run: git clone --depth 1 https://github.com/Soroban-Clear-Sign-Kit/SCSK-Backend.git ../SCSK-Backend
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v3
        with:
          version: 12
      - name: Build Backend Core
        run: |
          pnpm --dir ../SCSK-Backend install
          pnpm --dir ../SCSK-Backend run build
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Package Checks (publint & arethetypeswrong)
        run: pnpm run check:package
      - name: Size Limit Budgets
        run: pnpm run check:size
      - name: Packed Tarball Clean Vite Consumer Test
        run: pnpm run test:tarball
      - run: pnpm run test:coverage
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright Visual Regression Tests
        run: pnpm run test:e2e
      - name: Upload Visual Diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs-node-${{ matrix.node-version }}
          path: test-results/
          if-no-files-found: ignore
